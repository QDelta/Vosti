[project]
name = "vosti"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Deterministic model serving with verified orchestration and kernels."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28.0,<1",
  "torch==2.13.0",
  "triton==3.7.1",
  "transformers>=4.51.0",
]

[dependency-groups]
verification = ["networkx", "z3-solver==4.15.8"]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
package = false
default-groups = ["dev", "verification"]
constraint-dependencies = ["cuda-bindings==13.0.3"]

[tool.ruff]
exclude = [".venv"]

[tool.pytest.ini_options]
faulthandler_timeout = 120
markers = ["loopback: requires a local TCP socket for the HTTP fixture"]

[tool.basedpyright]
reportAny = false
reportMissingParameterType = "hint"
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
